name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate connection configuration
        shell: bash
        run: |
          # A tracked .env may already supply publishable client configuration.
          node --input-type=module <<'JS'
          import { loadEnv } from 'vite';
          const env = loadEnv('production', process.cwd(), 'VITE_');
          const url = process.env.VITE_SUPABASE_URL || env.VITE_SUPABASE_URL;
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY || env.VITE_SUPABASE_PUBLISHABLE_KEY;
          if (!url || !key || !url.startsWith('https://')) throw new Error('Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in repository Actions variables');
          // Empty workflow variables must not shadow a tracked .env during Vite build.
          JS
      - name: Regression tests
        run: bun run test
      - name: Build web assets
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then unset VITE_SUPABASE_URL; fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then unset VITE_SUPABASE_PUBLISHABLE_KEY; fi
          bun run build
      - name: Generate native shell if missing
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          node scripts/prepare-android.mjs
      - name: Generate Android icons
        run: bunx @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#FAF7F2' --splashBackgroundColor '#FAF7F2'
      - name: Synchronize Android
        run: bunx cap sync android
      - name: Assemble installable test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nails-by-kristina-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14